services:
  generic-rag:
    image: generic-rag
    build:
      context: .
      dockerfile: Dockerfile
    hostname: generic-rag
    ports:
      - "5000:5000"
    depends_on:
      - core
      - chat
      - vectordb
      - elasticsearch
    env_file:
      - .env
    environment:
      - DIAL_URL=http://core:8080
      - DB_HOST=vectordb
      - ELASTICSEARCH_URL=http://elasticsearch:9200
